plugins {
    id 'com.android.application'
}
android {
    namespace 'ir.imaps.mapapp'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.imaps.mapapp'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
